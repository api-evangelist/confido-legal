generated: '2026-09-05'
method: searched
source: https://docs.confidolegal.com/docs/introduction/sandbox-environment + https://docs.confidolegal.com/docs/sandbox/test-payment-methods + graphql/confido-legal-introspection.json
provider: Confido Legal
providerId: confido-legal
description: >-
  Confido Legal runs a full parallel sandbox with its own accounts, its own tokens, the
  same GraphQL schema, published test card and ACH values, and 14 sandbox-only mutations
  that let an integrator drive the money-movement state machine by hand. All values below
  are published by Confido; none is invented.
environments:
- name: sandbox
  api: https://api.sandbox.gravity-legal.com/
  api_v2: https://api.sandbox.gravity-legal.com/v2
  console: https://app.sandbox.confidolegal.com
  js_cdn: https://js.sandbox.gravity-legal.com
  playground: https://api.sandbox.gravity-legal.com
- name: production
  api: https://api.gravity-legal.com/
  console: https://app.confidolegal.com
  js_cdn: https://js.gravity-legal.com
signup:
  detail: >-
    The sandbox is a separate account, not a mode flag on a production account. You sign up
    for it independently at app.sandbox.confidolegal.com.
  self_serve: true
key_prefixes:
  detail: >-
    The environment is encoded in the token itself, so a misrouted credential is visible
    on inspection.
  examples:
  - 'p_secret_sandbox_… (Partner, sandbox)'
  - 'f_secret_sandbox_… (Firm, sandbox)'
  - 'pay_public_sandbox_… (Payment Session, sandbox)'
  - 'onboarding_public_sandbox_… (Onboarding, sandbox)'
  note: Sandbox and production tokens are not interchangeable.
parity:
  schema: identical
  behavior: >-
    Money movement is simulated. Helpers such as mockOnboarding on createFirm and every
    sandboxOnly* mutation work only in sandbox and are rejected in production.
  trusted_domains: >-
    Sandbox does not enforce Trusted Domains for hosted fields (production does). Stored
    disbursement method forms DO require correctly configured trusted domains even in
    sandbox.
