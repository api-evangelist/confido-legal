test_ach:
  source: https://docs.confidolegal.com/docs/sandbox/test-payment-methods
  entries:
  - account_number: any
    routing_number: any
    result: success
  - account_number: any
    routing_number: '000000000'
    result: failure
  - account_number: '0000000000'
    routing_number: any
    result: failure
fixture_triggers:
  detail: >-
    Sandbox-only GraphQL mutations that force a state transition and fire the matching
    webhook. This is Confido's substitute for a dry-run mode — you rehearse against real
    state machines rather than simulating a call.
  method: derived
  source: graphql/confido-legal-introspection.json
  mutations:
  - name: sandboxOnlyMoveTransactionToFundsInTransit
    drives: transaction.funds_in_transit
  - name: sandboxOnlyMoveTransactionToDeposited
    drives: transaction.deposited
  - name: sandboxOnlyTriggerAchReturn
    drives: transaction.ach_returned
    note: >-
      Simulates an Insufficient Funds return on a transaction with type achPayment and
      sends the webhook.
  - name: sandboxOnlyTriggerChargeback
    drives: chargeback transaction type
  - name: sandboxOnlyTriggerChargebackReversal
    drives: chargeback_reversal transaction type
  - name: sandboxOnlyTriggerPrearbitrationLost
    drives: dispute pre-arbitration outcome
  - name: sandboxOnlyCreateMockStatement
    drives: statement.created
    note: Generates a statement for a given month with entirely random values.
  - name: sandboxOnlyUpdateMockStatement
    drives: statement.updated
  - name: sandboxOnlyDisbursementExpire
    drives: DisbursementStatus EXPIRED
  - name: sandboxOnlyActivateFirm
    drives: FirmStatus ACTIVE
  - name: sandboxOnlySendFirmToReview
    drives: FirmStatus APP_IN_REVIEW
  - name: sandboxOnlyFillOnboardingData
    drives: FirmStatus APP_IN_DRAFT
  - name: sandboxOnlySubmitOnboardingData
    drives: FirmStatus APP_SUBMITTED
  - name: sandboxOnlyFirmSurchargingUpdate
    drives: firm surcharging configuration
  also:
    name: createFirm(mockOnboarding)
    note: Shortcut that onboards a firm without walking the application states.
time_simulation:
  supported: false
  detail: >-
    No test clock. Time-dependent behaviour (deposit timelines, the same-day void cutoff,
    disbursement expiry) is exercised through the sandboxOnly* state-transition mutations
    rather than by advancing a clock.
production_cutover_checklist:
  source: https://docs.confidolegal.com/docs/introduction/sandbox-environment
  items:
  - Use production Partner and Firm API tokens and the production webhook secret from app.confidolegal.com.
  - Register production Connect callback URL and webhook URLs in the production portal.
  - Register production Trusted Domains — sandbox does not enforce them.
  - >-
    Confirm outbound IP or allowlisting requirements with support@confidolegal.com if your
    security team needs them; they are not a universal requirement.
