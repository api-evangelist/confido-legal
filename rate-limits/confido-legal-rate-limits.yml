specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Confido Legal
providerId: confido-legal
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://docs.confidolegal.com/docs/introduction/api-limits
description: >-
  Published rate limits for the Confido Legal GraphQL API. Replaces the 2026-05-04 bulk
  scaffold, whose tier/quota values were invented defaults and are now removed. Confido
  publishes ONE limit that applies to every caller — there are no per-plan tiers, because
  there are no plans.
docs: https://docs.confidolegal.com/docs/introduction/api-limits
limit_count: 2
limits:
- name: Request rate
  scope: per-principal
  scope_detail: >-
    Counted per firmId for a Firm API token and per partnerId for a Partner API token.
    The two buckets are separate.
  metric: requests_per_minute
  limit: 500
  timeFrame: minute
  burst: null
  applies:
  - Confido Legal GraphQL API
- name: Concurrency
  scope: per-principal
  scope_detail: Per firmId or partnerId, same bucket separation.
  metric: concurrent_requests
  limit: 10
  timeFrame: instant
  applies:
  - Confido Legal GraphQL API
tiers: []
tier_note: >-
  Confido publishes no plan tiers and no paid rate-limit uplift. The same 500/min and 10
  concurrent apply to everyone. For sustained traffic above these limits the documented
  route is to coordinate with support@confidolegal.com.
responseCodes:
  throttled: 429
  throttled_label: Too Many Requests
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
header_note: >-
  CHECKED, NOTHING TO RECORD. Confido documents no X-RateLimit-*, no RateLimit-* and no
  Retry-After header, and promises no runtime signal of remaining budget. An agent cannot
  read how much headroom it has; it can only observe the 429 after the fact. This is the
  single biggest agent-readiness gap in the Confido runtime surface.
retry_guidance:
  minimum_wait_seconds: 60
  strategy: exponential backoff
  documented_example: retry after 60s, then 120s, capped at a few minutes
  source: https://docs.confidolegal.com/docs/introduction/api-limits
bulk_operations:
  note: >-
    disbursementsCreateBulk performs many creates in one request but still counts toward
    the same per-firm limits and can return 429 if the firm is already near the cap.
  source: https://docs.confidolegal.com/docs/introduction/api-limits
large_workloads:
  guidance: >-
    For large backfills, spread work over time or coordinate with support@confidolegal.com
    if sustained traffic above these limits is expected.
