provider: Confido Legal
providerId: confido-legal
description: >-
  How the Confido Legal API changes over time. There is no version number and no published
  deprecation policy document; evolution is expressed entirely through GraphQL @deprecated
  directives, each of which names its replacement, plus an "Upcoming Changes" and a
  "Migrations" section in the docs.
versioning:
  scheme: unversioned GraphQL, evolved by field deprecation
  current_version: null
  version_header: none
  url_version_segment: >-
    A /v2 segment appears in some Confido docs pages and in the provider's own agent skill
    (api.gravity-legal.com/v2). The docs Overview names the bare root. Both reach the same
    schema.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: >-
    Confido publishes no dated deprecation or sunset policy, and serves no Sunset or
    Deprecation HTTP headers. What it does do well is name a replacement on every single
    deprecated schema member — all 26 carry an actionable deprecationReason. What is
    missing is the CLOCK: nothing states how long a deprecated field keeps working.
  mechanism: GraphQL @deprecated(reason:)
  advance_notice_surface: https://docs.confidolegal.com/upcoming-changes/firm-declined-status
  migration_guides:
  - title: Voids and Refunds Migration
    url: https://docs.confidolegal.com/migrations/voids-and-refunds-migration
    reason: >-
      A sponsor-bank change made voids and refunds able to exceed 60 seconds, so the three
      synchronous mutations were replaced by asynchronous ones with a request/result split.
    warning: >-
      Confido states that for firms onboarded on the new sponsor bank the LEGACY mutations
      return a "Not implemented" error — the deprecated path is already dead for those
      firms, not merely discouraged.
