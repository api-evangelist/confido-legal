- version: null
  date: '2026-01-15'
  title: FirmStatus.DECLINED added
  type: addition
  breaking: false
  highlights:
  - >-
    A new DECLINED value on the FirmStatus enum, assigned when a firm does not meet
    underwriting requirements. Terminal state; restarting requires contacting support.
  source: https://docs.confidolegal.com/upcoming-changes/firm-declined-status
  note: >-
    Additive to an enum, which is nonetheless breaking for any client that exhaustively
    switches on FirmStatus. Confido gave advance notice with a release date, which is the
    right practice.
- version: null
  date: null
  title: Voids and refunds became asynchronous
  type: breaking
  breaking: true
  highlights:
  - transactionRefund replaces refundTransaction
  - transactionVoid replaces voidTransaction
  - transactionVoidOrRefund replaces voidOrRefundTransaction
  - Response structure now separates request status from transaction results
  - Transaction lists in responses are nullable and may be empty initially
  - Status checking is required to determine completion (AWAITING_RESULT)
  - >-
    For firms onboarded on the new sponsor bank the legacy mutations already return
    "Not implemented" — the old path is removed, not merely deprecated, for those firms.
  cause: A sponsor-bank change made void/refund settlement able to exceed 60 seconds.
  source: https://docs.confidolegal.com/migrations/voids-and-refunds-migration
  note: Published without a date, so a consumer cannot tell when the cutover applies to them.
