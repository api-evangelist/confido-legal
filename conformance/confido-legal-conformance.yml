description: >-
  Standards and cross-cutting conventions the Confido Legal API does and does not conform
  to. Confido publishes no compliance page, no trust center and no certification list, so
  everything below is read either from the contract itself or from a specific documentation
  sentence — nothing is inferred from marketing language.
regulatory_regime: payments
entries:
- id: graphql
  name: GraphQL (June 2018 spec)
  conforms: true
  evidence: >-
    Live introspection at https://api.gravity-legal.com/ returns a complete __schema
    (285 types, 41 query fields, 98 mutation fields). Saved to
    graphql/confido-legal-introspection.json and rendered to graphql/confido-legal.graphql.
- id: graphql-introspection-open
  name: Open schema introspection
  conforms: true
  evidence: >-
    Introspection succeeds anonymously with no x-api-key when the request carries
    Content-Type application/json (Apollo CSRF prevention rejects it otherwise). Probed
    2026-09-05, HTTP 200.
- id: relay-cursor-connections
  name: Relay Cursor Connections
  conforms: true
  partial: true
  evidence: >-
    The schema declares Connection/Edge/PageInfo triples for ten collections
    (TransactionConnection, PaymentConnection, PaymentLinkConnection, ClientConnection,
    MatterConnection, ContactConnection, SubscriptionConnection, FirmConnection,
    StoredPaymentMethodConnection, AggregatePaymentLinkConnection). The top-level *List
    queries use plain *ListResult wrappers instead, so the surface is mixed.
- id: graphql-deprecation
  name: GraphQL @deprecated with replacement guidance
  conforms: true
  evidence: >-
    26 schema members carry @deprecated, and every one names its replacement in
    deprecationReason (e.g. Transaction.status -> status_v2, refundTransaction ->
    transactionRefund). Enumerated in lifecycle/confido-legal-lifecycle.yml.
- id: hmac-sha512-webhook-signing
  name: HMAC-SHA512 webhook signature
  conforms: true
  evidence: >-
    https://docs.confidolegal.com/docs/webhooks/configure publishes the X-SIGNATURE header,
    the sha512 HMAC construction, base64 digest encoding, and reference verification code.
- id: rfc9457
  name: RFC 9457 Problem Details
  conforms: false
  evidence: >-
    Errors are GraphQL errors[] objects with message/extensions.code/code/status. No
    application/problem+json, no type URI. Observed live 2026-09-05.
- id: idempotency-key
  name: Idempotency-Key request header
  conforms: false
  evidence: >-
    No Idempotency-Key header is documented anywhere in the docs corpus (grep of
