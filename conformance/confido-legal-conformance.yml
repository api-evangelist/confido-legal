- id: rfc8594-sunset
  name: RFC 8594 Sunset header
  conforms: false
  evidence: No Sunset or Deprecation HTTP headers, and no removal dates on any deprecated member.
- id: ratelimit-headers
  name: RateLimit / X-RateLimit response headers
  conforms: false
  evidence: >-
    https://docs.confidolegal.com/docs/introduction/api-limits states the limits (500 rpm,
