- id: openapi
  name: OpenAPI
  conforms: false
  not_applicable: true
  evidence: >-
    Confido is GraphQL-native. /openapi.json, /openapi.yaml, /swagger.json, /api-docs and
    /v1/openapi.json all return 400 (Apollo CSRF) on api.gravity-legal.com and 404 on
    docs.confidolegal.com. Absence of OpenAPI is a design choice here, not a gap — the
    machine-readable contract is the GraphQL schema.
domain_standards:
  note: >-
    Read from the CONTRACT, not from marketing prose. Confido's schema carries two genuine
    domain-standard signatures for the payments regime and is silent on the rest.
  entries:
  - id: nacha-ach-returns
    name: NACHA ACH return codes
    conforms: true
    confidence: medium
    evidence: >-
      Transaction.achReturnCode and Transaction.achReturnReason are first-class schema
      fields (graphql/confido-legal.graphql lines 3335-3336), alongside
      achReturnWindowActive and the achReturn TransactionType. The docs describe the
      simulated return as an "Insufficient Funds return error code"
      (https://docs.confidolegal.com/docs/payments-lifecycle/ach-returns), which is the
      NACHA R01 vocabulary. Confido does not publish the code table itself, so this is a
      structural rather than a documented conformance.
  - id: pci-dss
    name: PCI DSS
    conforms: true
    confidence: medium
    scope: scope-reduction claim, not a published attestation
    evidence: >-
      The docs state three times that Hosted Fields and Payment Links keep the integrator
      out of PCI scope by collecting card data in Confido-owned iframes and hosted pages
      (https://docs.confidolegal.com/docs/hosted-fields/overview,
      https://docs.confidolegal.com/docs/receive-money/payment-links). Confido asserts the
      architecture; it publishes no AOC, no SAQ level, no ROC and no compliance page.
      Recorded as a documented architectural claim, NOT as a verified certification.
  - id: card-brand-surcharge-rules
    name: US state and card-brand surcharge rules
    conforms: true
    confidence: high
    evidence: >-
      The SurchargeRegion enum enumerates 58 US states and territories, and surcharge
      configuration appears in 36 places across the schema (firm-level allow, per-link
      override, per-region rate, surchargeDefaulted, proportional surcharge refund). The
      docs state that card-brand rules and state laws on credit-card surcharges change and
      that firms should enable it only where permitted
      (https://docs.confidolegal.com/docs/receive-money/payment-links). Encoding the
      jurisdiction boundary in the type system is the strongest domain-standard signature
      in this contract.
  - id: iolta-trust-segregation
    name: IOLTA / attorney trust-account segregation
    conforms: true
    confidence: high
    evidence: >-
      BankAccount.category is documented in the schema as "The category of the bank
      account. Either 'operating' or 'trust'", and the split is carried through
      PaymentLink.amounts, FirmSettings default deposit accounts and the disbursement
      funding account. This is the legal-industry rule Confido exists to enforce, and it is
      expressed in the contract rather than in a policy document. It is a bar-association
      requirement rather than a published technical specification, so no external
      conformance document exists to point at.
  absent:
  - id: iso-20022
    reason: No ISO 20022 message types, pain/pacs identifiers or MX schemas anywhere in the schema.
  - id: 3-d-secure
    reason: >-
      No 3DS, threeDS, ECI, CAVV or liability-shift fields. Consistent with a US-only
      card-present-absent acquirer; SCA is a European requirement.
  - id: psd2-sca
    reason: US-market provider; no SCA surface and no EU regulatory claim.
  - id: emv
    reason: No card-present or terminal surface — this is a card-not-present platform.
  - id: confirmation-of-payee
    reason: UK scheme; not applicable to a US ACH/card provider.
