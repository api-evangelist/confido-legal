description: >-
  Entity-relationship graph of the Confido Legal platform, derived from live GraphQL
  introspection (285 types, 155 objects). The shape is a two-level tenancy — Partner owns
  Firms, Firm owns everything else — with money split cleanly into a receive side
  (Payment / PaymentLink / Transaction) and a send side (Disbursement), meeting again at
  Transaction.
tenancy:
  root: Partner
  detail: >-
    A Partner is a software company integrating Confido. A Firm is a law firm under that
    Partner. Almost every business object hangs off Firm, and a Firm token can only see
    its own Firm's data.
identifiers:
  format: UUID v4
  evidence: >-
    BankAccount.id is documented as "a unique uuidv4 value for this object", and
    DisbursementCreateInput.id must be a valid UUID v4 when client-supplied.
  prefixed_ids: false
  note: >-
    Confido does NOT use type-prefixed identifiers (no txn_, no cus_). An id alone does not
    say what it points at, so an agent must track type alongside id.
  external_correlation:
    field: externalId
    present_on: [Client, Matter, PaymentLink, AggregatePaymentLink, RefundRequest, VoidRequest]
    purpose: Correlate a Confido record with the partner system's own identifier.
  quickbooks:
    field: qbRealmId
    present_on: [Client, PaymentLink]
    query: clientFromQuickBooksReference
