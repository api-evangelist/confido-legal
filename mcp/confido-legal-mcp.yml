name: Confido Legal Docs MCP Server
status: published
description: >-
  Confido Legal runs a live, anonymous-readable remote MCP server on its documentation
  host. It is a DOCUMENTATION server (Mintlify-shaped): the three tools search and read
  the docs corpus and file feedback. It does NOT expose the Confido Legal GraphQL payments
  operations as MCP tools — an agent that wants to move money still calls the GraphQL API
  at api.gravity-legal.com directly with an x-api-key.
