finding: >-
  Confido Legal ships two agent surfaces that do not meet. The MCP server and the A2A
  agent card both live on docs.confidolegal.com and describe documentation; the callable
  payments platform lives on api.gravity-legal.com and is reachable only through GraphQL.
  An agent that discovers Confido Legal through its agent card or MCP server can read
  about payments but cannot execute one.
