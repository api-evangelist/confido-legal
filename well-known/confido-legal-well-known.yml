notes:
- >-
  app.confidolegal.com is a single-page-app catch-all: it answers 200 with the same HTML
  shell for EVERY /.well-known/* path, including paths that do not exist. None of its 200s
  is a document. Recorded for the audit trail; none is counted as served.
