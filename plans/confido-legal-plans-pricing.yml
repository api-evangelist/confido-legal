specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Confido Legal
providerId: confido-legal
created: '2026-05-04'
modified: '2026-09-05'
generated: '2026-09-05'
method: searched
source: https://confidolegal.com/pricing
description: >-
  Confido Legal's published pricing. Replaces the 2026-05-04 bulk scaffold, whose Free /
  Professional tiers and request quotas were invented and never existed. Confido runs NO
  tiered plans and charges NO subscription — it is interchange-style transaction pricing on
  a single flat rate card, with one optional onboarding fee. Every figure below is quoted
  from the pricing page.
pricing_model: per-transaction
plan_count: 1
subscription_fees:
  monthly: 0
  annual: 0
  termination: 0
  note: The pricing page states there are no monthly, annual, or termination fees.
plans:
- id: confido-legal-standard
  name: Standard
  type: usage-based
  currency: USD
  billing_period: per-transaction
  description: >-
    The only plan. Every Confido Legal account gets the same rate card and the same feature
    set; there is no gating by tier.
  entries:
  - label: ACH payment
    name: ach_payment
    type: transaction-fee
    metric: percent_of_transaction
    rate: '1%'
    cap: '$30.00'
    price_note: 1% per transaction, capped at $30
  - label: Credit / debit card payment
    name: card_payment
    type: transaction-fee
    metric: percent_of_transaction
    rate: '2.95%'
    cap: null
    price_note: 2.95% per transaction
  - label: Chargeback or unauthorized return
    name: chargeback_fee
    type: incident-fee
    metric: per_event
    price: '25.00'
    price_note: $25 chargeback or unauthorized return fee
  - label: Disbursement
    name: disbursement_fee
    type: transaction-fee
    metric: per_disbursement
    price: '3.00'
    price_note: $3 per disbursement
  - label: Expedited funds availability (paid by recipient)
    name: expedited_delivery
    type: transaction-fee
    metric: percent_of_transaction
    rate: '1%'
    cap: '$95.00'
    price_note: >-
      Recipients receive funds via ACH at no cost in 4-6 days, or pay 1% (capped at $95 per
      transaction) for faster delivery.
    paid_by: recipient
  - label: Concierge onboarding
    name: concierge_onboarding
    type: one-time-fee
    price: '500.00'
    price_note: >-
      $500 one-time fee, required only for firms NOT integrating through one of Confido's
      partners. A firm arriving through a partner integration does not pay it.
    conditional: true
  elements:
  - name: Card account updater
  - name: U.S.-based support
  - name: Access to all integrations
  - name: Access to all payment methods
  - name: Payment links
  - name: Automated payment plans
  - name: Stored payment methods
  - name: Split payments
  - name: Compliance fee routing
  - name: Credit card surcharging (where permitted)
  - name: Real-time disbursement tracking
api_access_pricing:
  metered: false
  detail: >-
    API access is not separately priced and carries no request quota. There is no free tier
    versus paid tier for the API — a partner integrates against the same GraphQL endpoint
    regardless of volume, subject to the flat 500 requests/minute limit.
  see: rate-limits/confido-legal-rate-limits.yml
partner_model:
  detail: >-
    A software company becomes a Partner by contacting Confido; there is no self-serve
    partner signup. Firms self-serve for the sandbox at app.sandbox.confidolegal.com.
  contact: support@confidolegal.com
