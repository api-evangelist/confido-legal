  version_note: >-
    CHECKED, NOTHING TO RECORD. The distribution is unpinned: there is no version in the
    URL, no versioned alias, no registry metadata endpoint, and no version constant in the
    bundle (the only version string inside is React 18.0.1, a bundled dependency). The file
    floats to whatever is current. The only currency signal available to a consumer is the
    HTTP Last-Modified header — 2026-08-29 on production, 2026-08-28 on sandbox — served
    with cache-control max-age=0 from AmazonS3 behind CloudFront. A consumer cannot pin a
    version, cannot pin an integrity hash against a stable artifact, and cannot tell what
    they are getting; neither can we.
