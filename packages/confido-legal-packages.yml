findings:
- >-
  No server-side SDK exists in any language. Every partner integrating Confido writes raw
  GraphQL against api.gravity-legal.com, which makes the schema and this repo's
  graphql/confido-legal.graphql the entire integration surface.
- >-
  Both browser SDKs are unpinned. That is a supply-chain and reproducibility gap a consumer
  cannot work around: no SRI hash is stable, no version can be locked, and a change ships
  to every partner's production page the moment the S3 object is replaced.
