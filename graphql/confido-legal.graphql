input DisbursementUpdateInput {
  id: String!
  allowedMethods: [DisbursementMethod!]
  """
  The amount in cents to disburse to the client. Must be greater than $0.00 and less than $100,000
  """
  amount: Float
  authorizedIdentities: [DisbursementIdentityInput!]
  clientId: String
  clientUpsert: ClientUpsertInput
  """
  The id of the stored disbursement method to send funds to. Pass null to clear.
  """
  destinationMethodId: String
  """
  If null, uses firm's default enhanced security settings.
  """
  enhancedSecurity: Boolean
  expiresAt: DateTimeISO
  """
  If null, uses firm's default expiry days settings
  """
  expiryDays: Int
  """
  Max failed transaction attempts before disbursement is set to FAILED. FIRM_ADMIN only. Increase to allow more attempts.
  """
  maxFailedTxns: Int
  """
  The id of the bank account to pull the funds out of for the disbursement.
  """
  fundingAccountId: String
  """
  Firm-internal note for the disbursement. Not shown on receipts or to payees. Pass null to clear.
