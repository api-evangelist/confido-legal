"""
A Stored Payment Method is a payment method (credit card, ACH, etc.) that has been saved to be charged
later in the future. A Stored Payment Method is created by first creating a URL for a specific Client.
The URL is then given to the Client for the payment method (credit card, ACH, etc.) info to be input.
After the Client saves their payment info at the URL, it can be found by querying the Client again with
the storedPaymentMethods included in the request.
"""
type StoredPaymentMethod implements Node {
  """
  A unique uuidv4 value for this object.
  """
  id: ID!
  """
  The balance associated with this Stored Payment Method object. All values in Cents.
  """
  balance: Balance!
  canReactivate: Boolean!
  """
  The brand of the stored payment method card if the paymentMethod is credit or debit.
  Example: 'mastercard' or 'visa'.
  """
  cardBrand: String
  """
  The Client associated with this Stored Payment Method. If null, Firm will be defined.
  """
  client: Client
  declineInfo: SpmDeclineInfo
  """
  The Firm associated with this Stored Payment Method. If null, Client will be defined.
  """
  firm: Firm
  """
  The last four digits (this will sometimes return three) of the card number or ach bank account. Example: '1234'.
  """
  lastFour: String
  """
  The name the user input on the Stored Payment Method creation page.
  """
  payerName: String
  """
  A nickname for this specific Stored Payment Method. This should be set after the user has created the
  Stored Payment Method and is used to help organize Stored Payment Methods if a single client has
  multiple.
  """
  nickname: String
  """
  The payment method of this Stored Payment Method. Example: 'ACH' or 'CREDIT'.
  """
  paymentMethod: String!
  status: String!
  sessions: [SavePaymentMethodSession!]!
  surcharging: StoredPaymentMethodSurcharging!
  type: String!
}

