"""
Defines a single Transaction. This is the payment that was actually sent to
the bank, credit card processor, etc.
"""
type Transaction implements Node {
  """
  A unique uuidv4 value for this object.
  """
  id: ID!
  """
  (Nullable) If the Transaction was an ACH payment, this status represents the
  current state of the Transaction, 'A' => Pending | 'B' => Originated | 'R' =>
  Returned | 'S' => Settled | 'V' => Voided.
  """
  achStatus: String @deprecated(reason: "Use status field instead")
  achReturnCode: String
  achReturnReason: String
  """
  Whether this ACH payment is still inside the bank return window.
  """
  achReturnWindowActive: Boolean!
  aggregatePaymentLink: AggregatePaymentLink
  """
  The amount in cents that was processed for the Transaction.
  """
  amountProcessed: Int!
  """
  The amount in cents that was refunded for the Transaction.
  """
  amountRefunded: Int!
  """
  The Bank Account that the Transaction was deposited into.
  """
  bankAccount: BankAccount!
  canRefund: Boolean!
  canVoid: Boolean!
  cardBrand: String
  client: Client
  createdOn: DateTimeISO!
  depositId: String
  disbursement: Disbursement
  disbursementAmounts: DisbursementAmounts
  errorMessage: String
  """
  A list of events related to the transaction. Only available when querying an individual transaction.
  """
  events: [TransactionEvent!]
  firm: Firm!
  lastFour: String
  legacySurchargeAmount: Int!
  legacySurchargeAmountRefunded: Int!
  matter: Matter
  """
  The id of the original transaction that was refunded, voided, or returned.
  """
  originalTransactionId: String
  """
  Stable id shared by transactions that belong to the same payment, refund, void, return, reversal, or chargeback group.
  """
  txnGroupId: String
  payerEmail: String
  payerEmails: [String!]
  payerName: String
  payerNotes: String
  paymentMethod: TransactionPaymentMethod!
  payment: Payment
  paymentLink: PaymentLink
  """
  External ID for tracking this payment in partner systems
  """
  payRequest: TransactionPayRequest
  """
  The environment this transaction was processed in. Possible values: 'mock', 'sandbox', 'production'.
  """
  processingEnv: String!
  """
  (Nullable) If the Transaction was an ACH payment, this will be set to a
  timestamp for when the payment was settled.
  """
  settledOn: DateTimeISO
  """
  True when a refund of this transaction will be debited from the firm's operating account and the firm should display a trust refund warning.
  """
  showTrustRefundWarning: Boolean!
  standingLink: StandingLink
  """
  The current status of the Transaction. Possible values: 'error' |
  'originated' | 'pending' | 'refunded' | 'returned' | 'reversed' |
  'settled' | 'successful' | 'voided'.
  """
  status: String! @deprecated(reason: "Deprecated in favor of `transaction.status_v2`.")
  """
  The current status of the Transaction.
  """
  status_v2: TransactionStatus2!
  storedPaymentMethod: StoredPaymentMethod
  subscription: Subscription
  """
  The amount in cents that was paid for surcharging. This is not included in the
  amount so the total amount processed would be amount + surchargeAmount.
  """
  surchargeAmount: Int!
  """
  The amount in cents that was refunded for surcharging. This is not included in
  the amountRefunded so the total amount refunded would be amountRefunded +
  surchargeAmountRefunded.
  """
  surchargeAmountRefunded: Int!
  surchargePercentage: Float
  """
  The type of the transaction. Possible values: 'achPayment' | 'ccPayment' |
  'chargeback' | 'chargeback_reversal' | 'error' | 'manualPayment' | 'refund' |
  'reverse' | 'transfer' | 'void'.
  """
  type: String!
  """
  A Date object representing the last time this Transaction was updated.
  """
  updatedOn: DateTimeISO!
  voidRequests: [VoidRequest!]!
  refundRequests: [RefundRequest!]!
}

