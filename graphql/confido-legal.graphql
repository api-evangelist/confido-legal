"""
Defines the input parameters for adding a new Address. This is
used internally through adding other entities such as Clients and
Contacts.
"""
input AddAddressInput {
  """
  (Optional) The city for this Address.
  """
  city: String
  """
  (Optional) The country for this Address. Defaults to US.
  """
  country: String
  """
  (Optional) The first line of the Address.
  """
  line1: String
  """
  (Optional) The second line of the Address, if necessary.
  """
  line2: String
  """
  (Optional) The state for this Address.
  """
  state: String
  """
  (Optional) The zip for this Address.
  """
  zip: String
}

input AddAggregatePaymentLinkInput {
  externalId: String
  memo: String
  paymentLinkIds: [String!]!
}

"""
Defines the structure for adding an amount.
"""
input AddAmountInput {
  """
  (Required) Integer value in cents.
  """
  amount: Int!
  """
  (Required) A uuidv4 id for the Bank Account to associate the amount with.
  """
  bankAccountId: String!
}

input AddClientInput {
  """
  (Optional) The address of the Client.
  """
  address: AddAddressInput
  """
  (Required) The name of the Client. This should be the default display name.
  """
  clientName: String!
  """
  (Optional) The primary email address for contacting this Client.
  """
  email: String
  """
  (Optional) An externalId for querying down the road.
  """
  externalId: String
  """
  (Required) The Firm to associate this Client with.
  """
  firmId: String
  """
  (Optional) The first name of the Client.
  """
  firstName: String
  """
  (Optional) The last name of the Client.
  """
  lastName: String
  """
  (Optional) The primary phone number of the Client.
  """
  phone: String
  """
  (Optional) The primary contact to create and attach to this Client.
  """
  primaryContact: AddPrimaryContactInput
  qbCustomerRef: String
  qbRealmId: String
  """
  (Optional) Wether or not to default surcharging on payments for this
  Client. If undefined, defaults to the Firm's settings.
  """
  surchargeEnabled: Boolean
}

input AddContactInput {
  """
  (Optional) The address to associate with the Contact.
  """
  address: AddAddressInput
  """
  (Required) The uuidv4 id for the Client to associate the Contact with.
  """
  clientId: ID!
  """
  (Optional) The email for this Contact.
  """
  email: String
  """
  (Required) The first name of the Contact.
  """
  firstName: String!
  """
  (Optional) Wether or not the Contact is a primary Contact. If null,
  defaults to false. When true, updates the Clients primary Contact to
  this Contact.
  """
  isPrimaryContact: Boolean
  """
  (Optional) The last name of the Contact.
  """
  lastName: String
  """
  (Optional) The phone number of the Contact.
  """
  phone: String
}

"""
Defines the input object for adding a Matter. The Client and secondary Client
can not be changed in the future so be sure to assign them correctly.
"""
input AddMatterInput {
  """
  A unique uuidv4 value for this object.
  """
  clientId: ID!
  """
  (Optional) An externalId for querying down the road.
  """
  externalId: String
  """
  A descriptive name for the Matter.
  """
  name: String!
  """
  (Optional) A secondary Client to associate with the Matter.
  """
  secondaryClientId: ID
}

input AddPaymentLinkInput {
  amounts: [AddAmountInput!]
  clientId: ID!
  externalId: ID
  matterId: ID
  memo: String
  operating: Int
  partialPaymentAllowed: Boolean
  paymentMethodsAllowed: [PaymentMethod!]
  qbEnabled: Boolean
  sendReceipts: Boolean
  surchargeEnabled: Boolean
  trust: Int
}

input AddPrimaryContactInput {
  address: AddAddressInput
  email: String
  firstName: String!
  lastName: String
  phone: String
}

input AddScheduleInput {
  """
  An object that defines when the subscription ends. This object should contain one (and
  only one) of the following keys: 'amountPaid', 'never', 'on', or 'payments'.
  
  When the subscription ends is updated, the original termination type can not be changed.
  For example, if the subscription ends was 'amountPaid', you can not update the ends to
  'never' or 'on'.
  """
  ends: SubscriptionEndsInput!
  """
  The frequency of the subscription. This object should contain one (and only one) of the
  following keys: 'biweekly', 'monthly', 'weekly', or 'yearly'.
  """
  frequency: SubscriptionFrequencyInput!
}

input AddSubscriptionInput {
  """
  (Optional) A list of one amount object. This represents the amount that will be charged
  on each billing cycle. Subscriptions can only have a single bank account/amount
  at this time.
  
  If this field is provided, operating and trust must be omitted.
  """
  amounts: [AddAmountInput!]
  """
  The id of a Client to associate the subscription with.
  """
  clientId: String!
  """
  (Optional) The id of a Matter to associate the subscription with.
  """
  matterId: String
  """
  (Optional) The payment methods to allow a client to input when activating the subscription.
  
  If this is omitted, the default firm payment methods will be used.
  """
  paymentMethods: [PaymentMethod!]
  """
  (Optional) The amount in cents to charge the client on each billing cycle. The amount
  will be deposited into the firm's default operating account.
  
  If this field is provided, amounts and trust must be omitted.
  """
  operating: Int
  """
  An object defining the schedule of the subscription. When the subscription charges the
  client and when the subscription is considered fulfilled.
  """
  schedule: AddScheduleInput!
  """
  The date in which the first subscription charge will be made. This will be
  a string value of the form 'YYYY-MM-DD'.
  """
  startDate: String
  """
  (Optional) The id of a stored payment method to set on the subscription. If this is
  provided, the status of the subscription will be 'active' immediately.
  
  If this is omitted, the subscription url that is returned should be used
  to collect the payment method from a firm's client.
  """
  storedPaymentMethodId: String
  """
  (Optional) The amount in cents to charge the client on each billing cycle. The amount
  will be deposited into the firm's default trust account.
  
  If this field is provided, amounts and operating must be omitted.
  """
  trust: Int
}

