input DisbursementCreateInput {
  allowedMethods: [DisbursementMethod!]
  """
  The amount in cents to disburse to the client. Must be greater than $0.00 and less than $100,000
  """
  amount: Int!
  authorizedIdentities: [DisbursementIdentityInput!]
  clientId: String
  clientUpsert: ClientUpsertInput
  """
  The id of the stored disbursement method to send funds to.
  """
  destinationMethodId: String
  """
  If null, uses firm's default security settings.
  """
  enhancedSecurity: Boolean
  """
  If null, uses firm's default expiry days settings
  """
  expiryDays: Int
  """
  The id of the bank account to pull the funds out of for the disbursement.
  """
  fundingAccountId: String!
  """
  Optional client-supplied ID for the new disbursement. Must be a valid UUIDv4 string. If null, the ID will be generated.
  """
  id: String
  """
  Firm-internal note for the disbursement. Not shown on receipts or to payees.
  """
  internalMemo: String
  matterId: String
  matterUpsert: MatterUpsertInput
  """
  Additional text included on the vendor receipt to help explain what the disbursement was for.
  """
  receiptMemo: String
  metadata: JSON
  """
  Defaults to 'DRAFT'.
  """
  status: DisbursementStatus
  vendorId: String
  vendorUpsert: VendorUpsertInput
}

input DisbursementIdentityInput {
  """
  Used to determine if the identity was pulled from a known source. Defaults to MANUAL.
